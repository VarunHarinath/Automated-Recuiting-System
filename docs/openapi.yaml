openapi: 3.0.3
info:
  title: Automated Recruitment Management System API
  version: 0.3.0
  description: Authentication, RBAC, and administrator-only internal user management.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /auth/login:
    post:
      summary: Authenticate an active internal user
      operationId: login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Unknown email, incorrect password, and inactive accounts use the same response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
                  details: []
  /auth/me:
    get:
      summary: Return the authenticated active user
      operationId: getCurrentUser
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccess'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /auth/logout:
    post:
      summary: Complete stateless logout
      description: The client must discard its access token. No server-side token blacklist or session is created.
      operationId: logout
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [message]
                    properties:
                      message: { type: string }
                  meta: { type: object }
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /users:
    get:
      summary: List internal users
      description: Requires the ADMINISTRATOR role.
      operationId: listUsers
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/UserRole' }
        - { name: isActive, in: query, schema: { type: boolean } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ManagedUser' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      summary: Create an internal user
      description: Requires the ADMINISTRATOR role. Passwords are accepted only for hashing and are never returned.
      operationId: createUser
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedUserSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/EmailConflictError' }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      summary: Get an internal user
      description: Requires the ADMINISTRATOR role.
      operationId: getUser
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedUserSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/UserNotFoundError' }
    patch:
      summary: Update an internal user
      description: Requires the ADMINISTRATOR role. Status and password fields are not accepted here.
      operationId: updateUser
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedUserSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/UserNotFoundError' }
        '409': { $ref: '#/components/responses/EmailConflictError' }
  /users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      summary: Activate or deactivate an internal user
      description: Requires the ADMINISTRATOR role. Administrators cannot deactivate their own authenticated account.
      operationId: updateUserStatus
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusRequest' }
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedUserSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/UserNotFoundError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationError:
      description: Missing, malformed, invalid, or expired authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: The authenticated user is not permitted to perform this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UserNotFoundError:
      description: The requested user does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    EmailConflictError:
      description: The normalized email is already assigned to another user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    UserRole:
      type: string
      enum: [ADMINISTRATOR, RECRUITER, INTERVIEWER]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 1 }
    User:
      type: object
      required: [id, firstName, lastName, email, role, isActive]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        role:
          $ref: '#/components/schemas/UserRole'
        isActive: { type: boolean }
    ManagedUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [createdAt, updatedAt]
          properties:
            lastLoginAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, password, role]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        role: { $ref: '#/components/schemas/UserRole' }
        isActive: { type: boolean, default: true }
    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: '#/components/schemas/UserRole' }
    UserStatusRequest:
      type: object
      additionalProperties: false
      required: [isActive]
      properties:
        isActive: { type: boolean }
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ManagedUserSuccess:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/ManagedUser' }
        meta: { type: object }
    LoginSuccess:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [accessToken, user]
          properties:
            accessToken: { type: string }
            user: { $ref: '#/components/schemas/User' }
        meta: { type: object }
    UserSuccess:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/User' }
        meta: { type: object }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, INVALID_CREDENTIALS, UNAUTHORIZED, FORBIDDEN, TOKEN_EXPIRED, INVALID_TOKEN, USER_NOT_FOUND, EMAIL_ALREADY_EXISTS]
            message: { type: string }
            details:
              type: array
              items: { type: object }
